name: publish

# 只在打 tag（v2.0.1）时真发布；手动触发只做打包预览，不碰 npm。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # 建 GitHub Release
  id-token: write   # npm provenance（OIDC）

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: 读版本号
        id: meta
        run: |
          name="$(node -p 'require("./package.json").name')"
          version="$(node -p 'require("./package.json").version')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: tag 必须与 package.json 版本一致
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="${{ steps.meta.outputs.version }}"
          echo "tag=$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag «$GITHUB_REF_NAME» 与 package.json 版本 «$pkg» 不一致"
            exit 1
          fi

      - name: 该版本是否已发布
        id: exists
        run: |
          ref="${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}"
          if npm view "$ref" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ref 已经发布过，本次跳过 npm publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 打包预览（发布前先看内容）
        run: npm pack --dry-run

      - name: 发布到 npm
        if: startsWith(github.ref, 'refs/tags/') && steps.exists.outputs.published == 'false'
        # prepublishOnly 会跑 prepublish-guard（构建 + 类型 + 测试 + 审计 + 端到端）。
        # --provenance 让 npm 页面显示「由这个仓库的这次 workflow 构建」。
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/') && steps.exists.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --generate-notes --title "$GITHUB_REF_NAME"

      - name: 收尾说明
        run: |
          echo "### ${{ steps.meta.outputs.name }}@${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.exists.outputs.published }}" = "true" ]; then
            echo "该版本已存在，未重复发布。" >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手动触发：只做了打包预览，未发布。发版请打 tag。" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "已发布：https://www.npmjs.com/package/${{ steps.meta.outputs.name }}/v/${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          fi
